<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aquariums — Beta</title><style>*{box-sizing:border-box}body{margin:0;background:#020d12;color:#eafaff;font:15px system-ui;overflow:hidden}#ui{position:fixed;inset:0;pointer-events:none}header{position:absolute;top:16px;left:16px;background:#041820dd;border:1px solid #1d5364;border-radius:12px;padding:12px 15px}h1{font-size:18px;margin:0}.beta{color:#5ed7ff;font-size:11px;font-weight:800}.panel{position:absolute;right:16px;top:16px;width:270px;background:#041820e8;border:1px solid #1d5364;border-radius:12px;padding:14px;pointer-events:auto}.bar{height:8px;background:#0a2934;border-radius:9px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:#46c8e8}.panel button,.back{border:1px solid #2e8197;background:#0b3c49;color:white;border-radius:8px;padding:9px 11px;margin:4px 2px;font-weight:700}.back{position:absolute;left:16px;bottom:16px;text-decoration:none;pointer-events:auto}.tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#041820dd;padding:9px 13px;border-radius:9px;color:#b9dce5}canvas{display:block}</style></head><body><div id="game"></div><div id="ui"><header><span class="beta">PLAYABLE BETA 0.1</span><h1>Aquariums</h1><div>Freshwater tank simulator</div></header><section class="panel"><b>Tank status</b><div>Water quality <span id="q">82%</span></div><div class="bar"><i id="qb" style="width:82%"></i></div><div>Fish health <span id="h">94%</span></div><div class="bar"><i id="hb" style="width:94%"></i></div><div>Food <span id="food">6</span></div><button id="feed">Feed fish</button><button id="water">20% water change</button><button id="plant">Add plant</button><p style="color:#94bbc5;font-size:12px">Keep water quality high. Overfeeding lowers water quality; water changes improve it.</p></section><a class="back" href="/play.html">← Choose world</a><div class="tip">Drag to orbit · Wheel to zoom · Care for your tank with the panel</div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>(()=>{const scene=new THREE.Scene();scene.background=new THREE.Color(0x03131a);const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);cam.position.set(12,8,18);const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.25));document.body.prepend(r.domElement);scene.add(new THREE.HemisphereLight(0x9deaff,0x071014,2.2));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(8,14,8);scene.add(key);const g=new THREE.Group();scene.add(g);const box=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);return m};const glass=new THREE.MeshPhysicalMaterial({color:0x8deaff,transparent:true,opacity:.16,roughness:.08,metalness:.05,side:THREE.DoubleSide});box(new THREE.BoxGeometry(15,8,8),glass,0,4,0);box(new THREE.BoxGeometry(14.7,.45,7.7),new THREE.MeshStandardMaterial({color:0x3b3028,roughness:1}),0,.3,0);const water=box(new THREE.BoxGeometry(14.6,6.8,7.6),new THREE.MeshPhysicalMaterial({color:0x147ca0,transparent:true,opacity:.22,roughness:.12}),0,3.65,0);const plants=[];function addPlant(x=(Math.random()-.5)*11,z=(Math.random()-.5)*5){const p=new THREE.Group();for(let i=0;i<5;i++){const leaf=new THREE.Mesh(new THREE.CapsuleGeometry(.12,1.3+Math.random(),3,6),new THREE.MeshStandardMaterial({color:i%2?0x2e9b55:0x4cbf67,roughness:.8}));leaf.position.set((i-2)*.18,1,0);leaf.rotation.z=(i-2)*.13;p.add(leaf)}p.position.set(x,.5,z);g.add(p);plants.push(p)}for(let i=0;i<7;i++)addPlant();const fish=[];function makeFish(x,y,z,c){const f=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:c,roughness:.55});const b=new THREE.Mesh(new THREE.SphereGeometry(.48,12,8),m);b.scale.set(1.7,.75,.65);f.add(b);const tail=new THREE.Mesh(new THREE.ConeGeometry(.48,.8,3),m);tail.rotation.z=Math.PI/2;tail.position.x=-1;f.add(tail);f.position.set(x,y,z);f.userData={s:.35+Math.random()*.4,phase:Math.random()*9};g.add(f);fish.push(f)}[0xff704f,0x55d8ff,0xffd45a,0xe8e8ee,0x62e487,0xff7fc8].forEach((c,i)=>makeFish((i-3)*1.6,2.3+(i%3),-1+i%2*2,c));let quality=82,health=94,food=6,yaw=.55,pitch=.25,dist=21,drag=false,lx=0,ly=0;const upd=()=>{q.textContent=Math.round(quality)+'%';qb.style.width=quality+'%';h.textContent=Math.round(health)+'%';hb.style.width=health+'%';food.textContent=food};feed.onclick=()=>{if(food>0){food--;quality=Math.max(0,quality-3);health=Math.min(100,health+2);upd()}};water.onclick=()=>{quality=Math.min(100,quality+16);health=Math.min(100,health+1);upd()};plant.onclick=()=>addPlant();r.domElement.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY};onpointerup=()=>drag=false;onpointermove=e=>{if(drag){yaw-=(e.clientX-lx)*.008;pitch=Math.max(-.15,Math.min(.8,pitch+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY}};onwheel=e=>dist=Math.max(11,Math.min(32,dist+e.deltaY*.015));let last=performance.now();function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;fish.forEach((f,i)=>{f.userData.phase+=dt*f.userData.s;f.position.x=Math.sin(f.userData.phase)*5.5;f.position.z=Math.cos(f.userData.phase*.7+i)*2.5;f.position.y=2.2+(i%3)+Math.sin(f.userData.phase*1.7)*.3;f.rotation.y=Math.cos(f.userData.phase)>=0?0:Math.PI});quality=Math.max(0,quality-dt*.025);health=Math.max(0,Math.min(100,health+dt*(quality>55?.006:-.035)));cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,5+Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,3.5,0);r.render(scene,cam);requestAnimationFrame(loop)}requestAnimationFrame(loop);setInterval(upd,800);onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}})()</script></body></html>
